name: Tests

on:
  push:
    paths:
      - "server.py"
      - "e2e_test.py"
      - "requirements.txt"
      - ".github/workflows/**"

  pull_request:
    paths:
      - "server.py"
      - "e2e_test.py"
      - "requirements.txt"
      - ".github/workflows/**"

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python e2e_test.py &
          sleep 2
          # поднимаем сервер на тестовый прогон (e2e внутри себя стартует клиентов)
          # тест требует живой сервер — запускаем и его
          python server.py &
          SERVER_PID=$!
          sleep 2
          python e2e_test.py
          EXIT=$?
          kill $SERVER_PID 2>/dev/null
          exit $EXIT
