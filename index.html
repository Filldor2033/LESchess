<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LESchess — шахматы с чатом</title>
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<style>
/* ============ Токены — скопированы из /root/LESogram/frontend/src/app.css ============ */
:root {
    --bg: #0f172a;
    --card: #111827;
    --card-2: #0b1220;
    --panel: #020617;
    --accent: #22c55e;
    --accent-2: #16a34a;
    --accent-line: rgba(34, 197, 94, 0.26);
    --text: #e5e7eb;
    --muted: #9ca3af;
    --muted-2: #cbd5e1;
    --danger: #ef4444;
    --border: #1f2937;
    --shadow: 0 18px 45px rgba(2, 6, 23, 0.42);

    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 12px;

    --page-padding: 24px;
}

* { box-sizing: border-box; }

html {
    height: 100%;
    -webkit-text-size-adjust: 100%;
    overflow-x: clip;
}

body {
    margin: 0;
    min-height: 100dvh;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background:
        radial-gradient(circle at top right, rgba(34, 197, 94, 0.16), transparent 24%),
        radial-gradient(circle at 15% 18%, rgba(59, 130, 246, 0.10), transparent 26%),
        radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.08), transparent 30%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 30%),
        var(--bg);
    color: var(--text);
    min-width: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(var(--page-padding), env(safe-area-inset-top)) max(var(--page-padding), env(safe-area-inset-right)) max(var(--page-padding), env(safe-area-inset-bottom)) max(var(--page-padding), env(safe-area-inset-left));
}

button, input, select, textarea {
    font: inherit;
    max-width: 100%;
    border: none;
    outline: none;
}

button { min-height: 44px; }

input, select {
    min-height: 44px;
    width: 100%;
    padding: 11px 13px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    background: var(--panel);
    color: white;
    margin-bottom: 10px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
}

input::placeholder { color: #7c8aa1; }

input:focus {
    outline: none;
    border-color: var(--accent-line);
    box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.10);
}

button {
    width: 100%;
    padding: 11px 13px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #04120a;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 10px 24px rgba(22, 163, 74, 0.18);
    transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    touch-action: manipulation;
}

button:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 28px rgba(22, 163, 74, 0.24);
}

button:active { transform: translateY(0); }
button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.secondary {
    background: linear-gradient(180deg, #3a475c, #334155);
    color: white;
    box-shadow: none;
}

.small-btn {
    width: auto;
    min-height: 38px;
    padding: 8px 12px;
    flex-shrink: 0;
}

/* ============ Панели (как .panel/.chat-panel в LESogram) ============ */
.glass-panel {
    background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 26%),
        rgba(17, 24, 39, 0.96);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    border: 1px solid rgba(148, 163, 184, 0.10);
    backdrop-filter: blur(14px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.header {
    flex-shrink: 0;
    background:
        linear-gradient(90deg, rgba(34, 197, 94, 0.08), transparent 28%),
        rgba(2, 6, 23, 0.92);
    padding: 16px 18px;
    font-weight: bold;
    border-bottom: 1px solid rgba(148, 163, 184, 0.08);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.brand-logo {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 12px;
    object-fit: cover;
    box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.14), 0 8px 18px rgba(2, 6, 23, 0.45);
}

.brand-copy { min-width: 0; }

.brand-title {
    font-size: 17px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.brand-subtitle {
    margin-top: 2px;
    font-size: 12px;
    font-weight: normal;
    color: var(--muted);
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.section { padding: 18px; }

.section-block {
    padding: 14px;
    border-radius: var(--radius-md);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(2, 6, 23, 0.20));
    border: 1px solid rgba(148, 163, 184, 0.08);
}

.section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 12px;
    font-weight: bold;
}

.status {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
    min-height: 18px;
    line-height: 1.4;
}

.error-text { color: var(--danger); }

/* ============ Auth-экран ============ */
#authWrap {
    width: min(420px, 100%);
    margin: auto 0;
    animation: msgIn 0.25s cubic-bezier(0.2, 0.8, 0.3, 1.02) backwards;
}

/* ============ Лобби ============ */
#lobbyWrap {
    width: min(560px, 100%);
    margin: auto 0;
    animation: msgIn 0.25s cubic-bezier(0.2, 0.8, 0.3, 1.02) backwards;
}

.room-item {
    background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 60%),
        var(--card-2);
    padding: 13px;
    border-radius: var(--radius-md);
    margin-bottom: 10px;
    border: 1px solid rgba(148, 163, 184, 0.08);
    transition:
        transform 0.18s cubic-bezier(0.2, 0.8, 0.3, 1.05),
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;
    min-width: 0;
    cursor: pointer;
    animation: roomIn 0.25s cubic-bezier(0.2, 0.8, 0.3, 1.02) backwards;
}

@keyframes roomIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.room-item:hover {
    transform: translateY(-2px);
    border-color: rgba(34, 197, 94, 0.22);
    box-shadow: 0 12px 28px rgba(2, 6, 23, 0.28);
    background:
        linear-gradient(180deg, rgba(34, 197, 94, 0.05), transparent 60%),
        var(--card-2);
}

.room-item:active { transform: translateY(0) scale(0.99); }

#roomList .room-item:nth-child(1) { animation-delay: 0ms; }
#roomList .room-item:nth-child(2) { animation-delay: 35ms; }
#roomList .room-item:nth-child(3) { animation-delay: 70ms; }
#roomList .room-item:nth-child(4) { animation-delay: 105ms; }
#roomList .room-item:nth-child(n+5) { animation-delay: 140ms; }

.room-title {
    font-weight: bold;
    font-size: 15px;
    overflow-wrap: anywhere;
}

.room-meta {
    font-size: 12px;
    color: var(--muted);
    margin: 6px 0 10px;
    line-height: 1.4;
}

.section-pill {
    display: inline-flex;
    flex-shrink: 0;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
    color: var(--muted-2);
    background: rgba(148, 163, 184, 0.08);
    border: 1px solid rgba(148, 163, 184, 0.08);
    white-space: nowrap;
}

/* ============ Модалки ============ */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

.modal {
    width: min(380px, calc(100% - 32px));
    padding: 0;
    animation: msgIn 0.22s cubic-bezier(0.2, 0.8, 0.3, 1.02) backwards;
}

.modal-hint {
    font-size: 13px;
    color: var(--muted-2);
    margin: -6px 0 10px;
    overflow-wrap: anywhere;
}

/* выбор фигуры при превращении */
.promo-choices {
    display: flex;
    gap: 10px;
    margin-top: 8px;
}
.promo-btn {
    flex: 1;
    min-width: 0;
    width: auto;
    padding: 14px 0 10px;
    font-size: 34px;
    line-height: 1;
    color: #f8fafc;
    background: linear-gradient(180deg, #3a475c, #334155);
    box-shadow: none;
}
.promo-btn:hover {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #04120a;
}

/* кнопки внутри модалок: дышат, а не прилипают друг к другу */
.modal button { margin-top: 6px; }
.modal button + button { margin-top: 10px; }

/* ============ Кнопки партии (отмена хода / ничья / сдаться) ============ */
.game-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}
.game-actions button {
    flex: 1;
    min-width: 0;
    padding: 9px 8px;
    font-size: 13px;
}

#lobbyEmpty {
    color: var(--muted-2);
    font-size: 13px;
    text-align: center;
    padding: 22px 8px;
}

.lock-ico {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    opacity: 0.75;
    margin-right: 6px;
}

/* ============ Игровая комната ============ */
#gameWrap {
    width: min(1100px, 100%);
    margin: auto 0;
    animation: msgIn 0.25s cubic-bezier(0.2, 0.8, 0.3, 1.02) backwards;
}

.header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
}

.header-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
}

.turn-badge {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 7px;
    min-height: 22px;
}

.turn-badge .clock {
    display: inline-flex;
    align-items: center;
    padding: 2px 9px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    background: rgba(148, 163, 184, 0.14);
    border: 1px solid rgba(148, 163, 184, 0.18);
    color: var(--muted-2);
}
.turn-badge .clock.low {
    background: rgba(239, 68, 68, 0.16);
    border-color: rgba(239, 68, 68, 0.4);
    color: #f87171;
    animation: clockPulse 1s ease-in-out infinite;
}
@keyframes clockPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
}

.turn-badge .dot {
    width: 11px;
    height: 11px;
    border-radius: 999px;
    background: #f8fafc;
    box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.14);
    flex-shrink: 0;
}

.turn-badge .dot.black {
    background: #111;
    border: 1px solid #475569;
}

.turn-badge.yourturn {
    color: #86efac;
    font-weight: bold;
}

.game-area {
    display: flex;
    gap: 18px;
    padding: 18px;
    align-items: stretch;      /* колонка равна высоте доски — чат не растёт вниз */
    flex-wrap: wrap;
}

/* --- Доска --- */
.board-wrap {
    position: relative;
    flex-shrink: 0;
}

.board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    width: min(92vw, 540px, calc(100dvh - 260px));
    aspect-ratio: 1;
    border-radius: var(--radius-md);
    overflow: hidden;
    border: 2px solid rgba(148, 163, 184, 0.14);
    box-shadow: 0 18px 45px rgba(2, 6, 23, 0.42);
    user-select: none;
    touch-action: manipulation;
}

.cell {
    position: relative;
    display: grid;
    place-items: center;
    cursor: pointer;
    aspect-ratio: 1;
}

.cell.light { background: #b8ccd4; }
.cell.dark { background: #4a6d7c; }

.cell.sel::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(34, 197, 94, 0.35);
    z-index: 3;
}

.cell.lastmove { box-shadow: inset 0 0 0 3px rgba(34, 197, 94, 0.6); }
.cell.check { box-shadow: inset 0 0 0 3px var(--danger); }

.cell .piece {
    z-index: 2;
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    pointer-events: none;
    transition: transform 0.12s ease;
}

.cell .piece-svg {
    width: 94%;
    height: 94%;
    display: block;
    filter: drop-shadow(0 2px 3px rgba(2, 6, 23, 0.5));
}

/* драгабельные свои фигуры получают события указателя */
.cell .piece.draggable {
    pointer-events: auto;
    cursor: grab;
    touch-action: none;
}

.cell .piece.draggable:active { cursor: grabbing; }

.cell:hover .piece.draggable .piece-svg { transform: scale(1.08); }

/* плавающая копия при перетаскивании */
.drag-ghost {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 1000;
    pointer-events: none;
    display: grid;
    place-items: center;
    filter: drop-shadow(0 8px 16px rgba(2, 6, 23, 0.55));
    transform: scale(1.15);
    cursor: grabbing;
}


/* подсветка клетки под курсором при дропе */
.cell.drop-ok { box-shadow: inset 0 0 0 4px var(--accent), inset 0 0 18px rgba(34, 197, 94, 0.35); }
.cell.drop-no { box-shadow: inset 0 0 0 3px rgba(239, 68, 68, 0.7); }

.cell .hintdot {
    position: absolute;
    width: 26%;
    height: 26%;
    border-radius: 999px;
    background: rgba(2, 6, 23, 0.45);
    z-index: 1;
}

.cell.hintcap::before {
    content: '';
    position: absolute;
    width: 84%;
    height: 84%;
    border-radius: 999px;
    border: 4px solid rgba(239, 68, 68, 0.55);
    z-index: 1;
}

.coord {
    position: absolute;
    font-size: 10px;
    color: rgba(15, 23, 42, 0.55);
    font-weight: bold;
    z-index: 1;
}

.coord.file { bottom: 2px; right: 4px; }
.coord.rank { top: 2px; left: 4px; }
.cell.dark .coord { color: rgba(226, 232, 240, 0.5); }

/* --- Сайд-панель --- */
.side {
    flex: 1;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-height: 100%;          /* не выше доски */
    min-height: 0;
}

.players-box { display: flex; flex-direction: column; gap: 8px; }

.player-row {
    display: grid;
    grid-template-columns: 38px minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    padding: 7px 10px;
    border-radius: 14px;
    transition: background 0.15s ease, transform 0.15s ease;
}

.player-row:hover { background: rgba(148, 163, 184, 0.08); }

.player-avatar {
    width: 38px;
    height: 38px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #04120a;
    font-weight: bold;
    box-shadow: 0 8px 18px rgba(22, 163, 74, 0.20);
}

.player-avatar.b {
    background: linear-gradient(135deg, #64748b, #334155);
    color: white;
}

.player-name {
    min-width: 0;
    font-weight: bold;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.player-badge {
    padding: 5px 8px;
    border-radius: 999px;
    background: rgba(34, 197, 94, 0.12);
    border: 1px solid rgba(34, 197, 94, 0.16);
    color: #86efac;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

.player-badge.pending {
    background: rgba(148, 163, 184, 0.08);
    border-color: rgba(148, 163, 184, 0.12);
    color: var(--muted);
    font-style: italic;
    text-transform: none;
}

/* --- Чат (как в LESogram) --- */
.chat { display: flex; flex-direction: column; min-height: 320px; flex: 1 1 auto; min-height: 0; }

.chat-log {
    flex: 1 1 0;               /* ровно остаток высоты панели — не растягивает страницу */
    min-height: 120px;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background:
        radial-gradient(circle at top center, rgba(34, 197, 94, 0.06), transparent 34%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 16%);
}

.msg {
    max-width: min(82%, 620px);
    padding: 13px 14px;
    border-radius: 18px;
    word-break: break-word;
    overflow-wrap: anywhere;
    display: flex;
    flex-direction: column;
    gap: 4px;
    box-shadow: 0 12px 28px rgba(2, 6, 23, 0.18);
    align-items: flex-start;
    width: fit-content;
    animation: msgIn 0.22s cubic-bezier(0.2, 0.8, 0.3, 1.05);
}

@keyframes msgIn {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.msg.me {
    align-self: flex-end;
    background: linear-gradient(135deg, #22c55e, #84cc16);
    color: #05140b;
    border-bottom-right-radius: 6px;
}

.msg.other {
    align-self: flex-start;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), #1f2937);
    color: var(--text);
    border: 1px solid rgba(148, 163, 184, 0.06);
    border-bottom-left-radius: 6px;
}

.msg.system {
    max-width: min(90%, 560px);
    align-self: center;
    color: var(--muted);
    font-size: 12px;
    background: rgba(148, 163, 184, 0.08);
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(148, 163, 184, 0.08);
    box-shadow: none;
    text-align: center;
}

.msg-username {
    font-size: 12px;
    font-weight: bold;
    opacity: 0.92;
    text-transform: uppercase;
    letter-spacing: 0.08em;
}

.msg-text { white-space: pre-wrap; line-height: 1.45; }

/* --- Композер (как в LESogram) --- */
.composer {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    padding: 14px;
    background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 60%),
        rgba(2, 6, 23, 0.56);
    position: relative;
}

.input-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
}

.input-row input {
    margin: 0;
    flex: 1;
    min-width: 0;
}

.input-row button {
    flex-shrink: 0;
    width: 44px;
    min-width: 44px;
    padding: 9px 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.input-row button svg {
    width: 18px;
    height: 18px;
    transition: transform 0.18s cubic-bezier(0.2, 0.9, 0.3, 1.3);
}

.input-row button:not(:disabled):hover svg {
    transform: translateX(3px);
}

/* --- Gameover оверлей --- */
.gameover {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
    background: rgba(15, 23, 42, 0.82);
    backdrop-filter: blur(4px);
    border-radius: var(--radius-md);
    z-index: 10;
}

.gameover.show { display: grid; }

.go-inner {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
    padding: 20px;
    animation: popupIn 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.1);
}

@keyframes popupIn {
    from { opacity: 0; transform: translateY(-8px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.go-inner .go-title { font-size: 26px; font-weight: bold; }
.go-inner .go-sub { color: var(--muted-2); font-size: 14px; }
.go-inner button { width: auto; padding: 11px 18px; }

/* ============ Иконки (из icons.ts LESogram, stroke 1.8) ============ */
.icon {
    display: inline-block;
    vertical-align: middle;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* ============ Мобилка ============ */
/* Планшет/телефон в альбомке и узкие десктопы: колонка, доска сверху */
@media (max-width: 900px) {
    :root { --page-padding: 12px; }

    .game-area {
        flex-direction: column;
        align-items: stretch;
        padding: 12px;
        gap: 12px;
    }

    .side { width: 100%; min-width: 0; }

    .board-wrap { margin: 0 auto; }
    .board {
        width: min(96vw, 480px, calc(100dvh - 320px));
    }

    .header-row { flex-wrap: wrap; }
    .chat-log { min-height: 160px; }
    .chat { min-height: 180px; max-height: 42dvh; }
}

/* ============ Телефон ============ */
@media (max-width: 640px) {
    :root { --page-padding: 10px; --radius-lg: 18px; --radius-md: 14px; --radius-sm: 10px; }

    /* --- Хедер: компактный, кнопки в одну строку с брендом --- */
    .header { padding: 12px 14px; }

    .brand-logo { width: 34px; height: 34px; border-radius: 9px; }
    .brand { gap: 10px; }
    .brand-title { font-size: 15px; }
    .brand-subtitle { font-size: 11px; }

    .header-row { gap: 8px; }
    .header-actions { gap: 6px; width: 100%; }
    .header-actions .small-btn { flex: 1; min-height: 40px; padding: 8px 10px; font-size: 13px; }

    .turn-badge { font-size: 12px; min-height: 20px; }

    /* --- Игровая зона: доска впритык, чат снизу --- */
    .game-area { padding: 10px; gap: 10px; }
    .board-wrap { margin: 0; width: 100%; }
    .board {
        width: 100%;
        max-width: min(100%, calc(100dvh - 250px));
        border-radius: var(--radius-md);
    }

    /* --- Игроки: две строки, крупные тапабельные ряды --- */
    .section-block { padding: 10px; border-radius: var(--radius-sm); }
    .section-title { font-size: 11px; margin-bottom: 8px; }
    .player-row { padding: 8px; gap: 8px; min-height: 52px; }
    .player-avatar { width: 34px; height: 34px; font-size: 14px; }
    .player-name { font-size: 14px; }
    .player-badge { font-size: 10px; padding: 4px 7px; }

    .side { gap: 10px; }

    /* --- Чат: тянется до низа экрана, композер не прыгает при клавиатуре --- */
    .chat { min-height: 0; flex: 1; max-height: 52dvh; }
    .chat .section { padding: 10px 12px 0 12px; }
    .chat-log {
        min-height: 180px;
        max-height: 42dvh;
        padding: 10px;
        gap: 8px;
    }
    .msg { padding: 10px 12px; border-radius: 15px; max-width: 86%; }
    .msg-username { font-size: 11px; }
    .composer { padding: 10px; }
    .input-row button { width: 48px; min-width: 48px; }
    .input-row button svg { width: 20px; height: 20px; }

    /* --- Auth/лобби: на весь экран без прокрутки на клавиатуре --- */
    #authWrap, #lobbyWrap { margin: 0; }
    .section { padding: 14px; }

    .room-item { padding: 11px; border-radius: var(--radius-sm); }
    .room-title { font-size: 14px; }
    .room-meta { font-size: 11px; margin: 5px 0 8px; }

    /* --- Gameover: компактнее --- */
    .go-inner .go-title { font-size: 20px; }
    .go-inner .go-sub { font-size: 12px; }
    .go-inner button { width: 100%; }

    /* --- Координаты доски мельче --- */
    .coord { font-size: 9px; }
    .coord.file { bottom: 1px; right: 2px; }
    .coord.rank { top: 1px; left: 2px; }
}

/* ============ Очень узкие телефоны (iPhone SE и меньше) ============ */
@media (max-width: 380px) {
    :root { --page-padding: 8px; }
    .brand-logo { width: 30px; height: 30px; }
    .brand-title { font-size: 14px; }
    .game-area { padding: 8px; gap: 8px; }
    .header-actions .small-btn { font-size: 12px; padding: 7px 8px; }
    .chat-log { max-height: 46dvh; }
}

/* ============ Мобильная клавиатура: сжимаем раскладку, чат остаётся видимым ============ */
@media (max-width: 640px) and (max-height: 500px) {
    .board { max-width: min(100%, 52dvh); }
    .chat-log { min-height: 120px; max-height: 30dvh; }
    .players-box { flex-direction: row; }
    .player-row { flex: 1; min-height: 46px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>
<body>

<!-- ============ Экран входа ============ -->
<div id="authWrap" class="glass-panel">
    <div class="header">
        <div class="brand">
            <img class="brand-logo" src="/logo.png" alt="LESchess">
            <div class="brand-copy">
                <div class="brand-title">LESchess</div>
                <div class="brand-subtitle">Шахматы с живым чатом и комнатами</div>
            </div>
        </div>
    </div>
    <div class="section">
        <div class="section-title">Игрок</div>
        <input id="nameInput" maxlength="20" placeholder="Твоё имя" autocomplete="off">
        <button id="joinBtn" type="button">Играть</button>
        <div id="joinStatus" class="status"></div>
    </div>
</div>

<!-- ============ Лобби ============ -->
<div id="lobbyWrap" class="glass-panel">
    <div class="header">
        <div class="brand">
            <img class="brand-logo" src="/logo.png" alt="LESchess">
            <div class="brand-copy">
                <div class="brand-title">LESchess</div>
                <div class="brand-subtitle" id="meLabel"></div>
            </div>
        </div>
    </div>
    <div class="section">
        <div class="section-title-row" style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px">
            <div class="section-title" style="margin-bottom:0">Комнаты</div>
            <button id="createBtn" class="small-btn" type="button">+ Новая</button>
        </div>
        <div id="lobbyStatus" class="status" style="min-height:0"></div>
        <div id="roomList"></div>
    </div>
</div>

<!-- ============ Модалка: создать комнату ============ -->
<div id="createRoomModal" class="modal-overlay" style="display:none">
    <div class="glass-panel modal" role="dialog" aria-modal="true" aria-labelledby="createRoomTitle">
        <div class="section">
            <div class="section-title" id="createRoomTitle">Новая комната</div>
            <input id="createRoomName" maxlength="40" placeholder="Название комнаты" autocomplete="off">
            <input id="createRoomPass" type="password" maxlength="40" placeholder="Пароль (необязательно)" autocomplete="new-password">
            <select id="createRoomTime">
                <option value="0">Время на ход: без лимита</option>
                <option value="15">15 секунд на ход</option>
                <option value="30">30 секунд на ход</option>
                <option value="60">60 секунд на ход</option>
                <option value="120">120 секунд на ход</option>
                <option value="custom">Своё время…</option>
            </select>
            <input id="createRoomTimeCustom" type="number" min="5" max="600" placeholder="Секунд на ход (5–600)" autocomplete="off" style="display:none">
            <button id="createRoomGo" type="button">Создать</button>
            <button id="createRoomCancel" class="secondary" type="button">Отмена</button>
            <div id="createRoomStatus" class="status"></div>
        </div>
    </div>
</div>

<!-- ============ Модалка: пароль для входа ============ -->
<div id="passModal" class="modal-overlay" style="display:none">
    <div class="glass-panel modal" role="dialog" aria-modal="true" aria-labelledby="passModalTitle">
        <div class="section">
            <div class="section-title" id="passModalTitle">Комната с паролем</div>
            <div class="modal-hint" id="passModalRoom"></div>
            <input id="passInput" type="password" maxlength="40" placeholder="Пароль комнаты" autocomplete="off">
            <button id="passGo" type="button">Войти</button>
            <button id="passCancel" class="secondary" type="button">Отмена</button>
            <div id="passStatus" class="status"></div>
        </div>
    </div>
</div>

<!-- ============ Модалка: превращение пешки ============ -->
<div id="promoModal" class="modal-overlay" style="display:none">
    <div class="glass-panel modal" role="dialog" aria-modal="true">
        <div class="section">
            <div class="section-title">Превращение пешки</div>
            <div class="modal-hint">Выбери, кем станет пешка на последней горизонтали</div>
            <div class="promo-choices">
                <button id="promoQ" class="promo-btn" type="button" title="Ферзь">♕</button>
                <button id="promoR" class="promo-btn" type="button" title="Ладья">♖</button>
                <button id="promoB" class="promo-btn" type="button" title="Слон">♗</button>
                <button id="promoN" class="promo-btn" type="button" title="Конь">♘</button>
            </div>
        </div>
    </div>
</div>

<!-- ============ Модалка: время на ход ============ -->
<div id="timeModal" class="modal-overlay" style="display:none">
    <div class="glass-panel modal" role="dialog" aria-modal="true">
        <div class="section">
            <div class="section-title">Время на ход</div>
            <div class="modal-hint">Лимит меняется сразу — часы перезапустятся с новым временем.</div>
            <select id="timeModalSelect">
                <option value="0">Без лимита</option>
                <option value="15">15 секунд</option>
                <option value="30">30 секунд</option>
                <option value="60">60 секунд</option>
                <option value="120">120 секунд</option>
                <option value="custom">Своё время…</option>
            </select>
            <input id="timeModalCustom" type="number" min="5" max="600" placeholder="Секунд на ход (5–600)" autocomplete="off" style="display:none">
            <button id="timeModalGo" type="button">Применить</button>
            <button id="timeModalCancel" class="secondary" type="button">Отмена</button>
            <div id="timeModalStatus" class="status"></div>
        </div>
    </div>
</div>

<!-- ============ Модалка: подтверждение действия (сдаться / согласиться) ============ -->
<div id="confirmModal" class="modal-overlay" style="display:none">
    <div class="glass-panel modal" role="dialog" aria-modal="true">
        <div class="section">
            <div class="section-title" id="confirmTitle">Подтверждение</div>
            <div class="modal-hint" id="confirmText"></div>
            <button id="confirmGo" type="button">Да</button>
            <button id="confirmCancel" class="secondary" type="button">Отмена</button>
        </div>
    </div>
</div>

<!-- ============ Игровая комната ============ -->
<div id="gameWrap" class="glass-panel">
    <div class="header">
        <div class="header-row">
            <div class="brand">
                <div class="brand-copy">
                    <div class="brand-title" id="roomName"></div>
                    <div class="turn-badge" id="turnBadge"></div>
                </div>
            </div>
            <div class="header-actions">
                <button id="resetBtn" class="secondary small-btn" type="button">Новая партия</button>
                <button id="leaveBtn" class="secondary small-btn" type="button">Выйти</button>
            </div>
        </div>
    </div>

    <div class="game-area">
        <div class="board-wrap">
            <div class="board" id="board"></div>
            <div class="gameover" id="gameover">
                <div class="go-inner">
                    <div class="go-title" id="goTitle"></div>
                    <div class="go-sub" id="goSub"></div>
                    <button id="goBtn" type="button">Играть снова</button>
                </div>
            </div>
        </div>

        <div class="side">
            <div class="section-block">
                <div class="section-title">Игроки</div>
                <div class="players-box" id="playersBox"></div>
                <div class="game-actions">
                    <button id="undoBtn" class="secondary small-btn" type="button" title="Отменить последний ход (нужно согласие соперника)">↩ Ход</button>
                    <button id="drawBtn" class="secondary small-btn" type="button" title="Предложить ничью">½ Ничья</button>
                    <button id="resignBtn" class="secondary small-btn" type="button" title="Сдаться">⚑ Сдаться</button>
                    <button id="timeBtn" class="secondary small-btn" type="button" title="Изменить время на ход">⏱ Время</button>
                </div>
            </div>

            <div class="glass-panel chat" style="flex:1;min-height:0">
                <div class="section" style="padding:14px 18px 0 18px;flex-shrink:0">
                    <div class="section-title">Чат комнаты</div>
                </div>
                <div class="chat-log" id="chatLog"></div>
                <div class="composer">
                    <div class="input-row">
                        <input id="chatInput" maxlength="500" placeholder="Сообщение..." autocomplete="off">
                        <button id="sendBtn" type="button" title="Отправить">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

function pieceSvg(code) {
  // классические фигуры Cburnett (Wikipedia, PD): полные пути с заливками

const $ = id => document.getElementById(id);
const authWrap = $('authWrap'), lobbyWrap = $('lobbyWrap'), gameWrap = $('gameWrap');
const boardEl = $('board'), chatLog = $('chatLog'), chatInput = $('chatInput');
const nameInput = $('nameInput'), joinStatus = $('joinStatus');

let ws = null;
let me = null;
let myColor = null;
let room = null;
let state = null;
let rooms = [];            // список комнат в лобби
let pendingRoom = null;    // комната, в которую пытаемся войти (ждём пароль)
let clockTimer = null;     // setInterval локального тика таймера
let clockEnds = null;      // unix ms, когда истекает время текущего хода
let players = {w: null, b: null};
let sel = null;
let hints = [];
let hintsPending = false;
let lastMove = null;
let inRoom = false;

// ---------- WS ----------
function wsUrl() {
  const l = location;
  return (l.protocol === 'https:' ? 'wss://' : 'ws://') + l.hostname + ':8091';
}
function connect() {
  ws = new WebSocket(wsUrl());
  ws.onmessage = e => {
    // строгий порядок: сообщения обрабатываются по одному, в порядке прихода;
    // рендеры склеиваются в один на кадр (requestAnimationFrame)
    msgQueue.push(e.data);
    if (!processing) processQueue();
  };
  ws.onclose = () => {
    if (inRoom) {
      addChatMsg({type: 'system', text: 'Соединение потеряно, переподключение...'});
      setTimeout(connect, 2000);
    }
  };
  ws.onopen = () => {
    const target = sessionStorage.getItem('chess_room');
    const saved = localStorage.getItem('chess_name');
    if (target && saved) {
      send({type: 'join', name: saved, room: target, roomName: sessionStorage.getItem('chess_room_name') || target});
    } else {
      send({type: 'list'});   // подписка на список комнат
    }
  };
}
function send(obj) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
}

// ---------- Экраны ----------
function showScreen(which) {
  authWrap.style.display = which === 'auth' ? 'flex' : 'none';
  lobbyWrap.style.display = which === 'lobby' ? 'flex' : 'none';
  gameWrap.style.display = which === 'room' ? 'flex' : 'none';
}
showScreen('auth');

// ---------- Очередь сообщений: строгий порядок + один рендер на кадр ----------
let msgQueue = [];
let processing = false;
let renderQueued = false;
let renderFn = null;   // последний полный рендер

function processQueue() {
  processing = true;
  while (msgQueue.length) {
    const raw = msgQueue.shift();
    try { handleMessage(JSON.parse(raw)); } catch (err) { console.error(err); }
  }
  processing = false;
  // отложенный единый рендер
  if (renderQueued && renderFn) {
    const fn = renderFn;
    renderQueued = false;
    renderFn = null;
    fn();
  }
  // страховка оверлея: партия активна — плашки «окончена» быть не должно
  if (state && state.status === 'active') {
    const go = $('gameover');
    if (go && go.classList.contains('show')) go.classList.remove('show');
  }
}

function queueRender(fn) {
  renderFn = fn;
  renderQueued = true;
}

// ---------- Сообщения ----------
function handleMessage(m) {
  switch (m.type) {
    case 'rooms':
      rooms = m.rooms || [];
      renderRooms();
      break;
    case 'welcome':
      me = m.name;
      myColor = m.color;
      room = m.room;
      players = m.players;
      state = m.state;
      inRoom = true;
      clockEnds = null;
      lastRenderedMoveNo = -1;
      renderEpoch = 0;
      sessionStorage.setItem('chess_room', m.room.id);
      sessionStorage.setItem('chess_room_name', m.room.name);
      localStorage.setItem('chess_name', me);
      showScreen('room');
      $('roomName').textContent = m.room.name;
      chatLog.innerHTML = '';
      lastMove = null; sel = null; hints = [];
      renderRoom();
      restartClock();
      m.chat.forEach(addChatMsg);
      break;
    case 'room':
      if (room && m.room.id === room.id) {
        room = m.room;
        $('roomName').textContent = room.name;
      }
      break;
    case 'state':
      state = m.state;
      queueRender(renderRoom);
      restartClock();
      break;
    case 'move':
      lastMove = {from: m.from, to: m.to};
      state = m.state;
      sel = null; hints = [];
      queueRender(renderRoom);
      restartClock();
      // ход сделан — открытую time-модалку закрываем (менять уже нельзя)
      if ($('timeModal').style.display === 'flex') closeTimeModal();
      break;
    case 'chat':
      addChatMsg(m);
      break;
    case 'system':
      addChatMsg({type: 'system', text: m.text});
      if (m.state) {
        state = m.state; sel = null; hints = []; lastMove = null;
        // рендерим СРАЗУ (важен порядок: оверлей должен уйти синхронно)
        renderRoom();
        restartClock();
        // смена сторон/лимита: оверлей «окончена» уходит при активном state
      }
      break;
    case 'players':
      // после «Новая партия» сервер меняет стороны: обновляем свой цвет
      if (me && (m.players.w === me || m.players.b === me)) {
        const newColor = m.players.w === me ? 'w' : 'b';
        if (newColor !== myColor) {
          myColor = newColor;
          queueRender(renderRoom);   // доска переворачивается под новый цвет
        }
      }
      players = m.players;
      renderPlayers();
      renderBadge();
      // соперник сел — часы стартовали на сервере; подтянем, если ещё не тикают
      if (!clockTimer && state && state.status === 'active' && state.moveTime
          && players.w && players.b) {
        // запросим свежий state с timeLeft лёгким способом: ходы своей фигуры не шлём —
        // сервер не имеет 'state'-запроса, но broadcast 'players' не несёт state.
        // Проще: локально считаем от turn, а timeLeft подтянется при следующем ходе.
        restartClock();
      }
      break;
    case 'moves':
      // устаревший ответ (позиция уже изменилась) — подсказки неактуальны
      if (state && state.moves > 0 && state.moves < lastRenderedMoveNo) break;
      // фигуры под sel уже нет (ход/взятие изменили позицию) — подсказки не рисуем
      if (sel && (!state.board[sel[1]] || !state.board[sel[1]][sel[0]])) {
        hints = []; hintsPending = false;
        break;
      }
      if (sel && sel[0] === m.x && sel[1] === m.y) {
        hints = m.moves;
        hintsPending = false;
        if (drag) {
          // во время драга DOM нельзя заменять (pointer-capture умрёт) —
          // дорисовываем подсказки на живые клетки
          for (const h of hints) {
            const c = boardEl.querySelector('.cell[data-x="' + h[0] + '"][data-y="' + h[1] + '"]');
            if (c) {
              if (state.board[h[1]][h[0]]) c.classList.add('hintcap');
              else {
                const dot = document.createElement('div');
                dot.className = 'hintdot';
                c.appendChild(dot);
              }
            }
          }
        } else {
          renderBoard();
        }
      }
      break;
    case 'request':
      // соперник предлагает: отмена хода / ничья — показать запрос
      if (m.from === me) return;   // своё предложение — ждём ответ
      showIncomingRequest(m);
      break;
    case 'request_done':
      closeConfirmModal();
      if (m.kind === 'resign') {
        // сдача: игра окончена
        if (m.state) { state = m.state; }
        renderRoom();
      } else if (!m.ok && m.text) {
        flashError(m.text);
      }
      // при ok придёт 'system' с новым state → renderRoom
      break;
    case 'error':
      if (!inRoom && lobbyWrap.style.display !== 'none') {
        // ошибка в лобби: неверный пароль / комната заполнена
        lobbyStatus(m.text, true);
        if (m.text === 'Неверный пароль комнаты' && pendingRoom) {
          $('passStatus').textContent = 'Неверный пароль';
          $('passStatus').classList.add('error-text');
          $('passModal').style.display = 'flex';
        }
      } else if (joinStatus.style.display !== 'none' && !inRoom) {
        joinStatus.textContent = m.text;
        joinStatus.classList.add('error-text');
      } else {
        flashError(m.text);
      }
      break;
  }
}

function flashError(text) {
  const badge = $('turnBadge');
  badge.innerHTML = '<span class="error-text">⚠ ' + esc(text) + '</span>';
  setTimeout(renderBadge, 2000);
}

// ---------- Рендер ----------
let lastRenderedMoveNo = -1;   // номер state.moves последнего отрисованного state
let renderEpoch = 0;            // растёт при каждой новой партии (reset)

function stateEpochKey(st) {
  // упорядочивание эпох: resets считаются «новее» любого числа полуходов
  return st.moves + 1000000 * renderEpoch;
}

function renderRoom() {
  // анти-«перемешивание»: игнорируем устаревшие state (приходят с опозданием).
  // reset (moves=0 при активной партии) — новая эпоха, всегда легитимен
  if (state && state.moves === 0 && lastRenderedMoveNo !== -1 && state.status === 'active') {
    renderEpoch++;
  }
  if (state && state.moves > 0 && state.moves < lastRenderedMoveNo) return;
  if (state) lastRenderedMoveNo = state.moves;
  renderBoard();
  renderPlayers();
  renderBadge();
  renderGameover();
  // время меняется только до первого хода
  const timeBtn = $('timeBtn');
  if (timeBtn) timeBtn.disabled = !!(state && state.moves > 0);
}

function renderPlayers() {
  const box = $('playersBox');
  const w = players.w, b = players.b;
  box.innerHTML =
    '<div class="player-row">' +
      '<div class="player-avatar">Б</div>' +
      '<div class="player-name">' + (w ? esc(w) + (w === me ? ' <span style="color:var(--muted);font-weight:normal">(ты)</span>' : '') : '') + '</div>' +
      '<div class="player-badge' + (w ? '' : ' pending') + '">' + (w ? 'белые' : 'ждём...') + '</div>' +
    '</div>' +
    '<div class="player-row">' +
      '<div class="player-avatar b">Ч</div>' +
      '<div class="player-name">' + (b ? esc(b) + (b === me ? ' <span style="color:var(--muted);font-weight:normal">(ты)</span>' : '') : '') + '</div>' +
      '<div class="player-badge' + (b ? '' : ' pending') + '">' + (b ? 'чёрные' : 'ждём...') + '</div>' +
    '</div>';
}

function renderBadge() {
  const badge = $('turnBadge');
  if (!state) return;
  if (state.status !== 'active') {
    badge.innerHTML = 'Партия окончена';
    badge.className = 'turn-badge';
    return;
  }
  const waiting = !players.w || !players.b;
  if (waiting) {
    badge.innerHTML = 'Ждём второго игрока...';
    badge.className = 'turn-badge';
    return;
  }
  const my = state.turn === myColor;
  const who = state.turn === 'w' ? 'Ход белых' : 'Ход чёрных';
  const check = state.inCheck ? ' • ШАХ!' : '';
  const clock = clockHtml();
  badge.className = 'turn-badge' + (my ? ' yourturn' : '');
  badge.innerHTML = '<div class="dot ' + (state.turn === 'b' ? 'black' : '') + '"></div>' + (my ? 'Твой ход' : who) + check + clock;
}

// ---------- Часы на ход ----------
function clockHtml() {
  if (!state || state.status !== 'active' || !state.moveTime || !clockEnds) return '';
  const left = Math.max(0, Math.ceil((clockEnds - Date.now()) / 1000));
  const low = left <= 10 ? ' low' : '';
  return '<span class="clock' + low + '">⏱ ' + left + 'с</span>';
}

function restartClock() {
  clearInterval(clockTimer);
  clockTimer = null;
  if (!state || state.status !== 'active' || !state.moveTime) return;
  // сервер присылает timeLeft (сек) — превращаем в локальный дедлайн;
  // если время только стартовало (timeLeft ещё не приехал) — берём полный лимит
  if (state.timeLeft != null) clockEnds = Date.now() + state.timeLeft * 1000;
  else clockEnds = Date.now() + state.moveTime * 1000;
  renderBadge();
  clockTimer = setInterval(() => {
    if (!state || state.status !== 'active') { clearInterval(clockTimer); clockTimer = null; return; }
    renderBadge();
  }, 1000);
}

function renderGameover() {
  const go = $('gameover');
  if (!state || state.status === 'active') { go.classList.remove('show'); return; }
  go.classList.add('show');
  const t = $('goTitle'), s = $('goSub');
  if (state.status === 'checkmate') {
    t.textContent = state.result === 'w' ? 'Мат! Победили белые' : 'Мат! Победили чёрные';
    t.style.color = 'var(--accent)';
  } else if (state.status === 'resign') {
    const iLost = (state.result === 'w' && myColor === 'b') || (state.result === 'b' && myColor === 'w');
    t.textContent = 'Сдача';
    t.style.color = iLost ? 'var(--muted-2)' : 'var(--accent)';
  } else if (state.status === 'timeup') {
    t.textContent = 'Время истекло';
    t.style.color = 'var(--muted-2)';
  } else {
    t.textContent = 'Ничья';
    t.style.color = 'var(--muted-2)';
  }
  const winner = state.result === 'w' ? players.w : players.b;
  if (state.status === 'checkmate') {
    s.textContent = (winner ? winner + ' выигрывает партию.' : '') + ' Сыграть ещё?';
  } else if (state.status === 'resign') {
    s.textContent = (winner ? winner + ' принимает победу — соперник сдался.' : '') + ' Сыграть ещё?';
  } else if (state.status === 'timeup') {
    s.textContent = (winner ? winner + ' побеждает — соперник просрочил ход.' : '') + ' Сыграть ещё?';
  } else {
    s.textContent = 'Никто не победил. Сыграть ещё?';
  }
}

// ---------- Доска ----------
function renderBoard() {
  if (!state) return;
  const flip = myColor === 'b';
  boardEl.innerHTML = '';
  for (let vy = 0; vy < 8; vy++) {
    for (let vx = 0; vx < 8; vx++) {
      const x = flip ? 7 - vx : vx;
      const y = flip ? 7 - vy : vy;
      const cell = document.createElement('div');
      const isLight = (x + y) % 2 === 0;
      cell.className = 'cell ' + (isLight ? 'light' : 'dark');
      cell.dataset.x = x;
      cell.dataset.y = y;

      const p = state.board[y][x];
      if (p) {
        const s = document.createElement('span');
        s.className = 'piece';
        if (state.status === 'active' && p[0] === myColor && p[0] === state.turn) {
          s.classList.add('draggable');
        }
        s.innerHTML = pieceSvg(p);
        cell.appendChild(s);
      }
      if (sel && sel[0] === x && sel[1] === y) cell.classList.add('sel');
      if (lastMove && ((lastMove.from[0] === x && lastMove.from[1] === y) ||
                       (lastMove.to[0] === x && lastMove.to[1] === y))) cell.classList.add('lastmove');
      if (state.inCheck && state.status === 'active' && p === state.turn + 'K') cell.classList.add('check');
      if (hints.some(h => h[0] === x && h[1] === y)) {
        if (state.board[y][x]) cell.classList.add('hintcap');
        else {
          const hint = document.createElement('div');
          hint.className = 'hintdot';
          cell.appendChild(hint);
        }
      }
      if (vy === 7) { const c = document.createElement('span'); c.className = 'coord file'; c.textContent = FILES[x]; cell.appendChild(c); }
      if (vx === 0) { const c = document.createElement('span'); c.className = 'coord rank'; c.textContent = 8 - y; cell.appendChild(c); }

      cell.addEventListener('click', () => onCellClick(x, y));
      attachPieceDrag(cell, x, y);
      boardEl.appendChild(cell);
    }
  }
}

// ---------- Drag-and-drop фигур ----------
let drag = null;   // {fromX, fromY, ghost, moved}
let suppressClickToggle = false;  // выбор сделан pointerdown ТЕКУЩЕГО жеста — click не должен его снимать

function attachPieceDrag(cell, x, y) {
  const piece = cell.querySelector('.piece');
  if (!piece) return;

  piece.style.touchAction = 'none';

  piece.addEventListener('pointerdown', e => {
    if (!state || state.status !== 'active') return;
    if (e.button !== undefined && e.button !== 0) return;
    // драг только своих фигур в свой ход
    const p = state.board[y][x];
    if (!p || p[0] !== myColor || p[0] !== state.turn) return;

    try { piece.setPointerCapture(e.pointerId); } catch (err) { /* синтетические события — ок */ }
    const r0 = piece.getBoundingClientRect();
    const startX = e.clientX, startY = e.clientY;
    // порог драга: для пальца — половина клетки (тап никогда не считается драгом),
    // для мыши — 8% (лёгкое шевеление при клике)
    const isTouch = e.pointerType === 'touch';
    const armLen = isTouch ? Math.max(r0.width * 0.5, 24) : Math.max(r0.width, 30) * 0.08;

    // выбираем фигуру БЕЗ перерендера (иначе потеряем pointer-capture):
    // подсветки вешаем на живые клетки классами
    suppressClickToggle = (!sel || sel[0] !== x || sel[1] !== y);
    if (suppressClickToggle) {
      sel = [x, y];
      hints = [];
      boardEl.querySelectorAll('.cell.sel').forEach(c => c.classList.remove('sel'));
      boardEl.querySelectorAll('.hintdot, .hintcap').forEach(c => { c.remove(); c.classList.remove('hintcap'); });
      cell.classList.add('sel');
      send({type: 'moves', x, y});
      hintsPending = true;
    } else if (!hints.length) {
      hintsPending = true;
    }

    // ghost создаётся лениво в pointermove, когда драг реально начался
    drag = {fromX: x, fromY: y, ghost: null, piece, r0, moved: false, pointerId: e.pointerId,
            hintsPending, startX, startY, armLen};
  });

  piece.addEventListener('pointermove', e => {
    if (!drag || drag.pointerId !== e.pointerId) return;
    if (!drag.moved) {
      const dist = Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY);
      if (dist < drag.armLen) return;
      drag.moved = true;
      if (!drag.ghost) {
        const ghost = drag.piece.cloneNode(true);
        ghost.classList.add('drag-ghost');
        ghost.style.width = drag.r0.width + 'px';
        ghost.style.height = drag.r0.height + 'px';
        document.body.appendChild(ghost);
        drag.ghost = ghost;
      }
    }
    positionGhost(e);
    highlightDropCell(e);
  });

  const finish = e => {
    if (!drag || (e && drag.pointerId !== e.pointerId)) return;
    const d = drag;
    const pending = d.hintsPending;   // подсказки ещё не пришли с сервера
    drag = null;
    if (d.ghost) d.ghost.remove();
    clearDropHighlight();
    if (!d.moved) return;                      // это был клик — click-хендлер сам разберётся
    const cell2 = cellFromPoint(e.clientX, e.clientY);
    if (cell2) {
      const tx = +cell2.dataset.x, ty = +cell2.dataset.y;
      if (tx === d.fromX && ty === d.fromY) { renderBoard(); return; }
      if (pending || hints.some(h => h[0] === tx && h[1] === ty)) {
        // hints может быть ещё пусты (RTT) — отправляем optimistic, сервер валидирует сам
        trySendMove([d.fromX, d.fromY], [tx, ty]);
        return;
      }
    }
    renderBoard();   // невалидный дроп — просто вернуть фигуру
  };
  piece.addEventListener('pointerup', finish);
  piece.addEventListener('pointercancel', finish);
}

function positionGhost(e) {
  if (!drag) return;
  drag.ghost.style.left = (e.clientX - drag.ghost.offsetWidth / 2) + 'px';
  drag.ghost.style.top = (e.clientY - drag.ghost.offsetHeight / 2) + 'px';
}

function cellFromPoint(cx, cy) {
  const el = document.elementFromPoint(cx, cy);
  return el ? el.closest('.cell') : null;
}

function highlightDropCell(e) {
  clearDropHighlight();
  const cell2 = cellFromPoint(e.clientX, e.clientY);
  if (cell2 && drag) {
    const tx = +cell2.dataset.x, ty = +cell2.dataset.y;
    const ok = hints.some(h => h[0] === tx && h[1] === ty);
    cell2.classList.add(ok ? 'drop-ok' : 'drop-no');
  }
}

function clearDropHighlight() {
  boardEl.querySelectorAll('.drop-ok, .drop-no').forEach(c => {
    c.classList.remove('drop-ok', 'drop-no');
  });
}

function onCellClick(x, y) {
  if (!state || state.status !== 'active') return;
  const p = state.board[y][x];
  if (p && p[0] === myColor && p[0] === state.turn) {
    if (sel && sel[0] === x && sel[1] === y) {
      if (suppressClickToggle) { suppressClickToggle = false; return; }
      sel = null; hints = [];
      renderBoard();
      return;
    }
    sel = [x, y];
    hints = [];
    renderBoard();
    hintsPending = true;
    send({type: 'moves', x, y});
    return;
  }
  if (sel && (hintsPending || hints.some(h => h[0] === x && h[1] === y))) {
    if (sel[0] === x && sel[1] === y) return;   // ход в ту же клетку — не шлём на сервер
    // hints могут ещё не прийти (RTT) — отправляем optimistic, сервер валидирует
    trySendMove(sel, [x, y]);
    hintsPending = false;
    return;
  }
  sel = null; hints = [];
  renderBoard();
}

// ---------- Чат ----------
function addChatMsg(m) {
  const div = document.createElement('div');
  if (m.type === 'system') {
    div.className = 'msg system';
    div.textContent = m.text;
  } else {
    div.className = 'msg ' + (m.name === me ? 'me' : 'other');
    if (m.name !== me) {
      const nm = document.createElement('div');
      nm.className = 'msg-username';
      nm.textContent = m.name;
      div.appendChild(nm);
    }
    const tx = document.createElement('div');
    tx.className = 'msg-text';
    tx.textContent = m.text;
    div.appendChild(tx);
  }
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function sendChat() {
  const t = chatInput.value.trim();
  if (!t) return;
  send({type: 'chat', text: t});
  chatInput.value = '';
}

// ---------- Лобби: список комнат ----------
const LOCK_SVG = '<svg class="lock-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

function renderRooms() {
  const list = $('roomList');
  if (!list) return;
  if (!rooms.length) {
    list.innerHTML = '<div id="lobbyEmpty">Пока пусто — создай первую комнату</div>';
    return;
  }
  list.innerHTML = rooms.map(r => {
    const status = r.status === 'active' ? (r.players >= 2 ? 'идёт партия' : 'ждём игроков') : 'партия окончена';
    return '<div class="room-item" data-room="' + esc(r.id) + '">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px">' +
        '<div class="room-title" style="display:flex;align-items:center;min-width:0">' +
          (r.locked ? LOCK_SVG : '') + '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(r.name) + '</span>' +
        '</div>' +
        '<span class="section-pill">' + r.players + '/2</span>' +
      '</div>' +
      '<div class="room-meta">' + status + ' • создана ' + new Date(r.created * 1000).toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'}) + '</div>' +
    '</div>';
  }).join('');
  list.querySelectorAll('.room-item').forEach(el => {
    el.addEventListener('click', () => {
      const r = rooms.find(x => x.id === el.dataset.room);
      if (!r) return;
      if (r.players >= 2) {
        lobbyStatus('Комната заполнена', true);
        return;
      }
      if (r.locked) {
        pendingRoom = r;
        $('passModalRoom').textContent = '«' + r.name + '» защищена паролем';
        $('passInput').value = '';
        $('passStatus').textContent = '';
        $('passModal').style.display = 'flex';
        setTimeout(() => $('passInput').focus(), 60);
      } else {
        send({type: 'join', name: me, room: r.id, roomName: r.name});
      }
    });
  });
}

function lobbyStatus(text, isErr) {
  const el = $('lobbyStatus');
  if (!el) return;
  el.textContent = text;
  el.classList.toggle('error-text', !!isErr);
}

// ---------- Модалка: создать комнату ----------
function openCreateRoom() {
  $('createRoomName').value = '';
  $('createRoomPass').value = '';
  $('createRoomTime').value = '0';
  $('createRoomTimeCustom').style.display = 'none';
  $('createRoomTimeCustom').value = '';
  $('createRoomStatus').textContent = '';
  $('createRoomModal').style.display = 'flex';
  setTimeout(() => $('createRoomName').focus(), 60);
}
function closeCreateRoom() { $('createRoomModal').style.display = 'none'; }

function doCreateRoom() {
  const nm = $('createRoomName').value.trim();
  if (!nm) {
    $('createRoomStatus').textContent = 'Придумай название';
    $('createRoomStatus').classList.add('error-text');
    return;
  }
  let mt = $('createRoomTime').value;
  if (mt === 'custom') {
    mt = parseInt($('createRoomTimeCustom').value, 10);
    if (!mt || mt < 5 || mt > 600) {
      $('createRoomStatus').textContent = 'Время: 5–600 секунд';
      $('createRoomStatus').classList.add('error-text');
      return;
    }
  }
  $('createRoomStatus').textContent = '';
  send({type: 'create', name: nm, password: $('createRoomPass').value.trim(),
        moveTime: +mt, playerName: me});
  closeCreateRoom();
}

// ---------- Модалка: подтверждение действия / запрос соперника ----------
let confirmAction = null;   // что делать при «Да»
function openConfirm(title, text, onGo) {
  confirmAction = onGo;
  $('confirmTitle').textContent = title;
  $('confirmText').textContent = text;
  $('confirmGo').textContent = 'Да';
  $('confirmModal').style.display = 'flex';
}
function closeConfirmModal() {
  $('confirmModal').style.display = 'none';
  confirmAction = null;
}
$('confirmGo').addEventListener('click', () => { if (confirmAction) confirmAction(); });
$('confirmCancel').addEventListener('click', closeConfirmModal);
$('confirmModal').addEventListener('click', e => { if (e.target === $('confirmModal')) closeConfirmModal(); });

// соперник что-то предложил — спросить согласие
function showIncomingRequest(m) {
  const kindTxt = m.kind === 'undo' ? 'отменить последний ход' : 'ничью';
  openConfirm('Запрос от соперника', m.from + ' предлагает ' + kindTxt + '. Согласиться?', () => {
    send({type: 'answer', kind: m.kind, ok: true});
    closeConfirmModal();
  });
  // кнопка «Отмена» = отказ: переопределим через отдельный листенер после закрытия
  const cancel = () => { send({type: 'answer', kind: m.kind, ok: false}); };
  $('confirmCancel').addEventListener('click', cancel, {once: true});
  $('confirmModal').addEventListener('click', e => { if (e.target === $('confirmModal')) cancel(); }, {once: true});
}

// ---------- Превращение пешки ----------
let pendingPromoMove = null;   // {from, to} — ждём выбора фигуры
const PROMO = {Q: 'Q', R: 'R', B: 'B', N: 'N'};

function isPromoMove(from, to) {
  if (!state) return false;
  const p = state.board[from[1]][from[0]];
  if (!p || p[1] !== 'P') return false;
  return to[1] === 0 || to[1] === 7;
}

function trySendMove(from, to) {
  if (isPromoMove(from, to)) {
    pendingPromoMove = {from: from.slice(), to: to.slice()};
    $('promoModal').style.display = 'flex';
    return;
  }
  send({type: 'move', from: from, to: to});
}

function sendPromo(kind) {
  if (!pendingPromoMove) { $('promoModal').style.display = 'none'; return; }
  const {from, to} = pendingPromoMove;
  pendingPromoMove = null;
  $('promoModal').style.display = 'none';
  send({type: 'move', from, to, promote: kind});
}
['Q', 'R', 'B', 'N'].forEach(k => {
  $('promo' + k).addEventListener('click', () => sendPromo(k));
});

// ---------- Кнопки партии: отмена хода / ничья / сдаться ----------
$('undoBtn').addEventListener('click', () => {
  openConfirm('Отмена хода', 'Отменить последний ход? Сопернику придётся согласиться.', () => {
    send({type: 'undo'});
    closeConfirmModal();
  });
});
$('drawBtn').addEventListener('click', () => {
  openConfirm('Предложить ничью', 'Предложить сопернику ничью?', () => {
    send({type: 'draw'});
    closeConfirmModal();
  });
});
$('resignBtn').addEventListener('click', () => {
  openConfirm('Сдаться', 'Точно сдаться? Партия будет проиграна.', () => {
    send({type: 'resign'});
    closeConfirmModal();
  });
});

// ---------- Модалка: пароль ----------
function closePass() {
  $('passModal').style.display = 'none';
  pendingRoom = null;
}
function doEnterPass() {
  if (!pendingRoom) return closePass();
  const pass = $('passInput').value;
  if (!pass) {
    $('passStatus').textContent = 'Введи пароль';
    $('passStatus').classList.add('error-text');
    return;
  }
  send({type: 'join', name: me, room: pendingRoom.id, roomName: pendingRoom.name, password: pass});
  $('passStatus').textContent = '';
  // ошибку «Неверный пароль» покажет case 'error' ниже — переоткроем модалку
}
// ошибку пароля ловим в handleMessage: если модалка была закрыта, покажем заново

// ---------- События ----------
function tryJoin() {
  const name = nameInput.value.trim();
  if (!name) {
    joinStatus.textContent = 'Введи имя, чтобы играть';
    joinStatus.classList.add('error-text');
    nameInput.focus();
    return;
  }
  joinStatus.classList.remove('error-text');
  joinStatus.textContent = '';
  localStorage.setItem('chess_name', name);
  me = name;
  if (ws && ws.readyState === 1) {
    send({type: 'list'});   // подписка на список комнат
    showScreen('lobby');
    $('meLabel').textContent = 'Ты: ' + name;
  } else {
    location.reload();
  }
}
$('joinBtn').addEventListener('click', tryJoin);
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryJoin(); });

$('sendBtn').addEventListener('click', sendChat);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

$('leaveBtn').addEventListener('click', () => {
  sessionStorage.removeItem('chess_room');
  sessionStorage.removeItem('chess_room_name');
  inRoom = false;
  if (ws) {
    try { send({type: 'leave'}); } catch (e) {}
    ws.onclose = null;
    ws.close();
  }
  location.reload();
});
$('resetBtn').addEventListener('click', () => send({type: 'reset'}));
$('goBtn').addEventListener('click', () => send({type: 'reset'}));
$('createBtn').addEventListener('click', openCreateRoom);
$('createRoomGo').addEventListener('click', doCreateRoom);
$('createRoomTime').addEventListener('change', () => {
  const custom = $('createRoomTime').value === 'custom';
  $('createRoomTimeCustom').style.display = custom ? 'block' : 'none';
  if (custom) $('createRoomTimeCustom').focus();
});
$('createRoomCancel').addEventListener('click', closeCreateRoom);
$('createRoomName').addEventListener('keydown', e => { if (e.key === 'Enter') doCreateRoom(); });
$('createRoomPass').addEventListener('keydown', e => { if (e.key === 'Enter') doCreateRoom(); });
$('createRoomModal').addEventListener('click', e => { if (e.target === $('createRoomModal')) closeCreateRoom(); });

// ---------- Модалка: время на ход (в комнате) ----------
function openTimeModal() {
  const cur = state && state.moveTime ? String(state.moveTime) : '0';
  const sel = $('timeModalSelect');
  sel.value = [ '0','15','30','60','120' ].includes(cur) ? cur : 'custom';
  $('timeModalCustom').style.display = sel.value === 'custom' ? 'block' : 'none';
  if (sel.value === 'custom' && state.moveTime) $('timeModalCustom').value = state.moveTime;
  else $('timeModalCustom').value = '';
  $('timeModalStatus').textContent = '';
  $('timeModal').style.display = 'flex';
}
function closeTimeModal() { $('timeModal').style.display = 'none'; }
function doSetTime() {
  let mt = $('timeModalSelect').value;
  if (mt === 'custom') {
    mt = parseInt($('timeModalCustom').value, 10);
    if (!mt || mt < 5 || mt > 600) {
      $('timeModalStatus').textContent = 'Время: 5–600 секунд';
      $('timeModalStatus').classList.add('error-text');
      return;
    }
  }
  send({type: 'settime', moveTime: +mt});
  closeTimeModal();
}
$('timeBtn').addEventListener('click', openTimeModal);
$('timeModalGo').addEventListener('click', doSetTime);
$('timeModalCancel').addEventListener('click', closeTimeModal);
$('timeModal').addEventListener('click', e => { if (e.target === $('timeModal')) closeTimeModal(); });
$('timeModalSelect').addEventListener('change', () => {
  const custom = $('timeModalSelect').value === 'custom';
  $('timeModalCustom').style.display = custom ? 'block' : 'none';
  if (custom) $('timeModalCustom').focus();
});

$('passGo').addEventListener('click', doEnterPass);
$('passCancel').addEventListener('click', closePass);
$('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') doEnterPass(); });
$('passModal').addEventListener('click', e => { if (e.target === $('passModal')) closePass(); });

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

if (localStorage.getItem('chess_name')) {
  nameInput.value = localStorage.getItem('chess_name');
}
connect();
</script>
